name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The project's release configuration currently uses a debug signing key.
      # This APK is for testing. Configure a permanent private key before release.
      - name: Build test APK in release mode
        run: flutter build apk --release

      - name: Name APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Rope-Guard-test.apk

      - name: Save downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Rope-Guard-APK
          path: build/app/outputs/flutter-apk/Rope-Guard-test.apk
          if-no-files-found: error
          retention-days: 14
